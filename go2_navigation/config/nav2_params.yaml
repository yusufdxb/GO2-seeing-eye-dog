# ============================================================================
# nav2_params.yaml: Nav2 (ROS 2 Humble) for the GO2, feeding the safety arbiter.
#
# Every plugin named here exists in Humble (the previous file referenced
# nav2_reactive_fallback_bt_node, which does not, and bt_navigator failed to
# configure). go2_bringup/test/test_nav2_params.py asserts the plugin names resolve.
#
# Velocity budget. Nav2 never reaches the robot: velocity_smoother -> /cmd_vel
# -> candidate_stamper -> /cmd_vel_candidate -> safety_arbiter -> bridge.
# The smoother limits sit INSIDE the arbiter's envelope (safety.yaml:
# max_vx 0.4, max_wz 0.6, max_accel_linear 0.5, max_accel_angular 1.0) so the
# arbiter clamps only as a backstop, never as part of normal tracking.
# hardware_validated: false for every number in this file.
#
# Frames: map (slam_toolbox) -> odom (go2_state_relay_node) -> base_link.
# Obstacles: /scan, produced by pointcloud_to_laserscan from the relayed L1
# cloud (see go2_localization/config/pointcloud_to_laserscan.yaml).
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Humble's stock navigate_to_pose_w_replanning_and_recovery tree is used
    # (the default when default_nav_to_pose_bt_xml is unset). plugin_lib_names
    # is Humble's stock list, verbatim.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      # A quadruped starting from a stand takes longer to get going than a
      # wheeled base; generous so a slow gait start is not a failure.
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # Short goals must require translation before the goal checker accepts, but a legged
      # robot cannot land within 0.05 m: 2026-10-19 arr_1 stalled 0.12 m short and aborted
      # on the progress checker. 0.20 still needs most of any goal >= 0.3 m walked.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.5

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.30
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: false
      # Slow only near the endpoint. A 0.08 m/s approach did not produce
      # sustained physical translation on the stock locomotion controller.
      min_approach_linear_velocity: 0.20
      approach_velocity_scaling_dist: 0.15
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 0.8
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.5
      # GO2 body is ~0.70 x 0.31 m; padded 3 cm per side.
      footprint: "[[0.38, 0.19], [0.38, -0.19], [-0.38, -0.19], [-0.38, 0.19]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wide, soft inflation keeps planned paths centred in 1 m doorways;
        # 0.55 / 3.0 let paths hug frames and RPP aborted on "collision
        # ahead" when the footprint clipped them (closed-loop sim).
        cost_scaling_factor: 2.5
        inflation_radius: 0.70
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      transform_tolerance: 0.5
      # Fixed 40 x 40 m window in the map frame, built from live LiDAR
      # obstacles, WITHOUT a static layer. With slam_toolbox's static map the
      # costmap only covers explored space, and a semantic goal in a room the
      # LiDAR has not seen yet fails with "goal off the global costmap"
      # (observed in closed-loop sim). slam_toolbox still provides map->odom.
      rolling_window: false
      width: 40
      height: 40
      origin_x: -20.0
      origin_y: -20.0
      track_unknown_space: true
      footprint: "[[0.38, 0.19], [0.38, -0.19], [-0.38, -0.19], [-0.38, 0.19]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Wide, soft inflation keeps planned paths centred in 1 m doorways;
        # 0.55 / 3.0 let paths hug frames and RPP aborted on "collision
        # ahead" when the footprint clipped them (closed-loop sim).
        cost_scaling_factor: 2.5
        inflation_radius: 0.70
      # go2-semantic-nav's grounding node gates on receipt freshness of
      # /global_costmap/costmap; updates-only publishing would go stale.
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac 2D (A* on the costmap grid). NavFn with use_astar: true failed
      # intermittently in closed-loop sim with "Failed to create a plan from
      # potential when a legal potential was found" when planning through
      # unknown space; that is a NavFn A* defect, not a costmap problem.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.3
      downsample_costmap: false
      downsampling_factor: 1
      # Semantic goals are often in space the map has not observed yet.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Inside the arbiter envelope (0.4 / 0.2 / 0.6); see header.
    max_velocity: [0.35, 0.0, 0.5]
    min_velocity: [-0.20, 0.0, -0.5]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.45, 0.0, -0.9]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    # How long the last controller command is republished after the controller
    # goes silent, before the ramp down starts. The stamper restamps every
    # smoothed command, so the arbiter and bridge watchdogs cannot see a dead
    # controller: this timeout is the only thing that ends the blind hold
    # (1.0 s measured 1.08 s of full-speed motion after a controller_server
    # SIGKILL in go2_sim). 0.25 s is 5 cycles of controller_frequency 20 Hz, so
    # one or two late controller cycles do not start a deceleration
    # (go2_bringup/test/test_smoother_stop_timeout.py checks both sides).
    velocity_timeout: 0.25
